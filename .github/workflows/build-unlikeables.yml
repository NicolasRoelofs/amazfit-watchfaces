name: Build Unlikeables Watchface

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/watchfaces/unlikeables/**"
      - ".github/workflows/build-unlikeables.yml"

  pull_request:
    paths:
      - "src/watchfaces/unlikeables/**"
      - ".github/workflows/build-unlikeables.yml"

jobs:
  build-unlikeables:
    name: Build unlikeables .zab
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/watchfaces/unlikeables

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Zeus CLI
        run: npm install -g @zeppos/zeus-cli

      - name: Show Zeus version
        run: zeus -v

      - name: Build watchface
        run: zeus build

      - name: List build output
        run: |
          pwd
          ls -la
          ls -la dist || true

      - name: Upload Unlikeables artifact
        uses: actions/upload-artifact@v4
        with:
          name: unlikeables-zab
          path: src/watchfaces/unlikeables/dist/**
          if-no-files-found: error
